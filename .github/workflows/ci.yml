name: CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn
      - run: corepack enable
      - run: corepack yarn install --immutable
      - run: corepack yarn type-check
      - run: corepack yarn test
      - run: corepack yarn build
